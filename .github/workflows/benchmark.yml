name: Benchmarks

# Throughput benchmarks that drive a release surfpool binary over JSON-RPC.
# See crates/bench/README.md for what is measured and how to run it locally.
#
# Pull requests: build the PR (merged into its base) and the base branch tip,
# benchmark them in interleaved rounds on the same machine, and fail when a
# gated metric regresses past the threshold.
#
# Pushes to main: benchmark the new tip and append the numbers to the history
# on the gh-pages branch for trend charts.
#
# The job runs on the runner named by the BENCH_RUNS_ON repository variable, a
# JSON array of labels for the dedicated bare-metal runner, and falls back to
# GitHub-hosted ubuntu-latest while that variable is unset. Fork pull requests
# are skipped so untrusted code never runs on the self-hosted machine. To
# benchmark a fork PR after reviewing its code, dispatch the workflow with the
# PR number and the exact head commit you reviewed; the run refuses to start
# if the PR head has moved since.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          Pull request number to benchmark against its base. Leave empty to
          record main history instead.
        default: ""
      head_sha:
        description: >-
          Full commit SHA of the PR head you reviewed. Required with `pr`; the
          run fails if the PR head no longer matches it.
        default: ""
      rounds:
        description: Interleaved rounds per side
        default: "3"
      duration_secs:
        description: Measured seconds per scenario
        default: "10"

permissions:
  contents: read

# One bench per ref at a time; a new push to a PR cancels its running bench.
# A manual run for a PR gets its own group so it does not cancel main history.
concurrency:
  group: benchmark-${{ github.ref }}-${{ github.event.inputs.pr || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Outside the checkout so actions/checkout's clean step does not wipe the
  # build cache between jobs on the self-hosted runner.
  CARGO_TARGET_DIR: ${{ github.workspace }}/../surfpool-bench-target
  BENCH_ROUNDS: ${{ github.event.inputs.rounds || '3' }}
  BENCH_DURATION_SECS: ${{ github.event.inputs.duration_secs || '10' }}
  # Relative regression on a gated metric that fails a pull request.
  BENCH_THRESHOLD: "0.15"

jobs:
  pull_request:
    name: PR vs base (A/B)
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '')
    runs-on: ${{ fromJSON(vars.BENCH_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual run checks out main's workflow, so the fork cannot change
      # these steps; only the code under test comes from the PR. The head is
      # pinned to the reviewed SHA, and the PR is merged into its base here
      # the same way the pull_request event's merge ref would be.
      - name: Check out reviewed fork PR (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.inputs.pr }}
          REVIEWED_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          if [ -z "$REVIEWED_SHA" ]; then
            echo "::error::head_sha is required when pr is set"; exit 1
          fi
          read -r head_sha base_ref < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.head.sha) \(.base.ref)"')
          if [ "$head_sha" != "$REVIEWED_SHA" ]; then
            echo "::error::PR #$PR head is $head_sha but you reviewed $REVIEWED_SHA; review the new head and dispatch again"
            exit 1
          fi
          git fetch origin "refs/pull/$PR/head" "$base_ref"
          git checkout --detach "origin/$base_ref"
          git -c user.name=bench -c user.email=bench@localhost merge --no-ff --no-edit "$REVIEWED_SHA"
          echo "BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$REVIEWED_SHA" >> "$GITHUB_ENV"

      - name: Install system dependencies (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev

      - name: Cache cargo (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ../surfpool-bench-target"

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Resolve base commit
        id: base
        env:
          BASE_REF: ${{ env.BASE_REF || github.base_ref }}
          HEAD_SHA: ${{ env.HEAD_SHA || github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Comparing $(git rev-parse --short HEAD) (PR $HEAD_SHA merged into $BASE_REF) against $(git rev-parse --short "$base") (base)"

      - name: Build head
        run: |
          cargo build --release --locked -p surfpool-cli -p surfpool-bench
          mkdir -p bench-bin
          cp "$CARGO_TARGET_DIR/release/surfpool" bench-bin/surfpool-head
          cp "$CARGO_TARGET_DIR/release/surfpool-bench" bench-bin/surfpool-bench

      - name: Build base
        env:
          BASE_SRC: ${{ github.workspace }}/../surfpool-bench-base
        run: |
          git worktree remove --force "$BASE_SRC" 2>/dev/null || rm -rf "$BASE_SRC"
          git worktree prune
          git worktree add --detach "$BASE_SRC" "${{ steps.base.outputs.sha }}"
          (cd "$BASE_SRC" && cargo build --release --locked -p surfpool-cli)
          cp "$CARGO_TARGET_DIR/release/surfpool" bench-bin/surfpool-base
          git worktree remove --force "$BASE_SRC"

      - name: Run A/B benchmark
        run: |
          # Start from an empty output directory so a failed run cannot
          # publish stale results from an earlier step or the checkout.
          rm -rf bench-results
          bench-bin/surfpool-bench ab \
            --base-bin bench-bin/surfpool-base \
            --head-bin bench-bin/surfpool-head \
            --base-commit "${{ steps.base.outputs.sha }}" \
            --head-commit "${{ steps.base.outputs.head_sha }}" \
            --rounds "$BENCH_ROUNDS" \
            --duration-secs "$BENCH_DURATION_SECS" \
            --threshold "$BENCH_THRESHOLD" \
            --out-dir bench-results

      - name: Publish summary
        if: always()
        run: |
          if [ -f bench-results/summary.md ]; then
            cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark did not produce a summary; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results
          if-no-files-found: ignore

  main_history:
    name: Record main history
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.pr == '')
    runs-on: ${{ fromJSON(vars.BENCH_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev

      - name: Cache cargo (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ../surfpool-bench-target"

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p surfpool-cli -p surfpool-bench

      - name: Run benchmark
        run: |
          rm -rf bench-results
          mkdir -p bench-results
          "$CARGO_TARGET_DIR/release/surfpool-bench" run \
            --surfpool-bin "$CARGO_TARGET_DIR/release/surfpool" \
            --label main \
            --commit "$GITHUB_SHA" \
            --rounds "$BENCH_ROUNDS" \
            --duration-secs "$BENCH_DURATION_SECS" \
            --out bench-results/main.json
          "$CARGO_TARGET_DIR/release/surfpool-bench" export \
            --input bench-results/main.json \
            --out bench-results/benchmark-action.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f bench-results/benchmark-action.json ]; then
            {
              echo "## Surfpool benchmark on main ($(git rev-parse --short "$GITHUB_SHA"))"
              echo
              echo "| Metric | Median | Range |"
              echo "|---|---:|---:|"
              jq -r '.[] | "| `\(.name)` | \(.value | . * 10 | round / 10) \(.unit) | \(.range // "") |"' bench-results/benchmark-action.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-main
          path: bench-results
          if-no-files-found: ignore

      - name: Ensure gh-pages branch exists
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            exit 0
          fi
          tmp=$(mktemp -d)
          git -C "$tmp" init -q -b gh-pages
          git -C "$tmp" -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q --allow-empty -m "Initialize benchmark history"
          git -C "$tmp" push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf "$tmp"

      - name: Append to history
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: surfpool throughput
          tool: customBiggerIsBetter
          output-file-path: bench-results/benchmark-action.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          auto-push: true
          # The pull-request job is the gate; the history is for trends only.
          fail-on-alert: false
          comment-on-alert: false
