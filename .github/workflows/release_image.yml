name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g., v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to build and publish as X.Y.Z, X.Y, X and latest; any other value is pushed as that single image tag (e.g. edge)"
        required: true
        type: string
      ref:
        description: "Git ref to build; defaults to `tag`"
        required: false
        type: string
        default: ""
      version:
        description: "Version to stamp into the workspace before building; defaults to the committed version"
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: surfpool/surfpool

jobs:
  build-image-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Stamp version
        if: inputs.version != ''
        run: node .github/scripts/set-version.js "${{ inputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=buildkit-amd64
          cache-to: type=gha,scope=buildkit-amd64,mode=max

  build-image-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Stamp version
        if: inputs.version != ''
        run: node .github/scripts/set-version.js "${{ inputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=buildkit-arm64
          cache-to: type=gha,scope=buildkit-arm64,mode=max

  merge-image-manifest:
    runs-on: ubuntu-latest
    needs:
      - build-image-amd64
      - build-image-arm64
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION%.*}"
            echo "${IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:${MINOR}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:${MAJOR}" >> $GITHUB_OUTPUT
            echo "${IMAGE}:latest" >> $GITHUB_OUTPUT
          else
            echo "${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifest
        run: |
          AMD64_DIGEST="${{ needs.build-image-amd64.outputs.digest }}"
          ARM64_DIGEST="${{ needs.build-image-arm64.outputs.digest }}"
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            docker buildx imagetools create --tag "$TAG" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST}" \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${ARM64_DIGEST}"
          done <<< "${{ steps.tags.outputs.tags }}"
