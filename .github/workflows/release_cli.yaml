name: Build Binaries
on:
  push:
    branches:
      - main
      - ci
      - supervised
      - feat/surfpool-studio
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Draft release tag created by release-please (e.g. v1.8.0); its binaries are attached and the release is published"
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  S3_BUCKET: txtx-public

concurrency:
  group: ${{ github.workflow }} @ ${{ inputs.tag || github.event.pull_request.head.label || github.head_ref || github.ref }}
  # A newer merge supersedes an in-flight edge build, but a stable release build
  # must always finish.
  cancel-in-progress: ${{ !inputs.tag }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve Version
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          filter: tree:0

      # stable: called by release_please.yml for a new release tag.
      # edge: any other push to main; published as the rolling `edge` prerelease.
      # none:   other branches and manual runs; build only.
      - name: Resolve channel and version
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          BASE="$(jq -r '."."' .release-please-manifest.json)"
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" != "v$BASE" ]]; then
              echo "::error::Tag $TAG does not match manifest version $BASE"
              exit 1
            fi
            CHANNEL=stable
            VERSION="$BASE"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            CHANNEL=edge
            VERSION="$(.github/scripts/edge-version.sh)"
          else
            CHANNEL=none
            VERSION="$BASE"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Building $CHANNEL $VERSION"

  dist_surfpool:
    name: Build Surfpool Distributions
    needs: version
    runs-on: ${{ matrix.os }}
    outputs:
      LINUX_X64_SHA: ${{ steps.linux_x64_sha.outputs.LINUX_X64_SHA }}
      MACOS_X64_SHA: ${{ steps.macos_x64_sha.outputs.MACOS_X64_SHA }}
      MACOS_ARM64_SHA: ${{ steps.macos_arm64_sha.outputs.MACOS_ARM64_SHA }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            architecture: x64
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            architecture: x64
          - os: macos-15-intel
            platform: darwin
            target: x86_64-apple-darwin
            architecture: x64
          - os: macos-15
            platform: darwin
            target: aarch64-apple-darwin
            architecture: arm64

    steps:
      # pre-build for windows
      - name: Configure git to use LF (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # pre-build for all OS
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      # set up rust for all envs
      - name: Install Rust toolchain
        shell: bash
        run: |
          RUST_TOOLCHAIN=$(awk -F '"' '/^channel/{print $2}' rust-toolchain)
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}

      # env vars unix
      - name: Get Rust version (unix)
        if: matrix.os != 'windows-latest'
        run: echo "RUST_VERSION_HASH=$(rustc --version | shasum -a 256 | awk '{print $1}')" >> $GITHUB_ENV

      # env vars windows
      - name: "Get Rust version (windows)"
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "RUST_VERSION_HASH=$(rustc --version | sha256sum | awk '{print $1}')" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/
            ./target/${{ matrix.target }}/release/
          key: ${{ runner.os }}-${{ matrix.target }}-rust-${{ env.RUST_VERSION_HASH }}-cargo-${{ hashFiles('./Cargo.lock') }}

      # Set deployment environment for the macOS arm64 build
      - name: Configure macos-arm64 cross compile config
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          echo "SDKROOT=$(xcrun -sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun -sdk macosx --show-sdk-platform-version)" >> $GITHUB_ENV

      - name: Configure openssl (macos x64)
        if: matrix.platform == 'darwin' && matrix.architecture == 'x64'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: Configure openssl (macos arm64)
        if: matrix.platform == 'darwin' && matrix.architecture == 'arm64'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(xcrun --show-sdk-path)/usr/include" >> $GITHUB_ENV
          echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV

      - name: Install LLVM/Clang (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libclang-dev pkg-config
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV

      # - name: Download OpenSSL (windows)
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     Invoke-WebRequest -Uri https://slproweb.com/download/Win64OpenSSL-3_0_16.exe -OutFile openssl-installer.exe
      #     Start-Process -Wait -FilePath .\openssl-installer.exe -ArgumentList "/silent", "/verysilent", "/dir=C:\OpenSSL"

      # - name: Set Env Vars for OpenSSL (windows)
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     echo "OPENSSL_DIR=C:\OpenSSL" >> $env:GITHUB_ENV
      #     echo "OPENSSL_LIB_DIR=C:\OpenSSL\lib\VC" >> $env:GITHUB_ENV
      #     echo "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV

      - name: Cache vcpkg (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v3
        with:
          path: |
            C:\vcpkg
          key: ${{ runner.os }}-vcpkg-openssl

      - name: Setup vcpkg and install OpenSSL (windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install openssl:x64-windows

          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV

      - name: Configure artifact names
        shell: bash
        run: |
          echo "SHORT_TARGET_NAME=${{ matrix.platform }}-${{ matrix.architecture }}" >> $GITHUB_ENV
          echo "PRE_GYP_TARGET_NAME=${{ matrix.platform }}-${{ matrix.architecture }}-unknown" >> $GITHUB_ENV

      - name: Install dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      # Runs after the cache step so the cache key still hashes the committed
      # Cargo.lock rather than a per-commit edge version.
      - name: Stamp edge version
        if: needs.version.outputs.channel == 'edge'
        shell: bash
        run: node .github/scripts/set-version.js "${{ needs.version.outputs.version }}"

      - name: Build - Cargo (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} --features supervisor_ui --features version_check

      - name: Build - Cargo (macOS x64)
        if: matrix.platform == 'darwin' && matrix.architecture == 'x64'
        run: cargo build --release --locked --target ${{ matrix.target }} --features supervisor_ui --features version_check

      - name: Build - Cargo (macOS ARM64)
        if: matrix.platform == 'darwin' && matrix.architecture == 'arm64'
        run: cargo build --release --locked --target ${{ matrix.target }} --features supervisor_ui --features version_check

      - name: Build - Cargo (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo build --release --locked --target ${{ matrix.target }} --features supervisor_ui --features version_check

      # Don't compress for Windows because winget can't yet unzip files
      - name: Compress cargo artifact (not windows)
        if: matrix.os != 'windows-latest'
        run: tar -C target/${{ matrix.target }}/release -zcvf surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz surfpool

      - name: Compress artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: tar -czf surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz -C target/${{ matrix.target }}/release surfpool.exe

      - name: Store SHA256 Hash of Tar (Linux x64)
        if: matrix.platform == 'linux'
        id: linux_x64_sha
        run: |
          echo "LINUX_X64_SHA=$(sha256sum surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Store SHA256 Hash of Tar (Mac x64)
        if: matrix.platform == 'darwin' && matrix.architecture == 'x64'
        id: macos_x64_sha
        run: |
          echo "MACOS_X64_SHA=$(shasum -a 256 surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Store SHA256 Hash of Tar (Mac arm64)
        if: matrix.platform == 'darwin' && matrix.architecture == 'arm64'
        id: macos_arm64_sha
        run: |
          echo "MACOS_ARM64_SHA=$(shasum -a 256 surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      # Separate uploads to prevent paths from being preserved
      - name: Upload cargo artifacts (not windows)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-${{ env.SHORT_TARGET_NAME }}
          path: surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz

      - name: Upload tar archive (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-${{ env.SHORT_TARGET_NAME }}
          path: surfpool-${{ env.SHORT_TARGET_NAME }}.tar.gz

  publish_stable:
    name: Publish Release
    needs:
      - version
      - dist_surfpool
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download pre-built dists
        uses: actions/download-artifact@v4
        with:
          pattern: surfpool-*
          merge-multiple: true

      # release-please leaves the release as a draft so /releases/latest (used
      # by install.sh and `surfpool update`) never points at a release without
      # binaries.
      - name: Attach binaries and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" surfpool-*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  publish_edge:
    name: Publish Edge
    needs:
      - version
      - dist_surfpool
    if: needs.version.outputs.channel == 'edge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pre-built dists
        uses: actions/download-artifact@v4
        with:
          pattern: surfpool-*
          merge-multiple: true

      # One rolling prerelease, edited in place: recreating it on every merge
      # would notify everyone watching the repo's releases.
      - name: Update rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          NOTES=$(cat <<NOTES_EOF
          Rolling prerelease rebuilt from every merge to \`main\`. Not covered by semver; use a tagged release for anything you depend on.

          **Version:** \`$VERSION\`
          **Commit:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA

          Install:

          \`\`\`console
          curl -sL https://run.surfpool.run/ | VERSION=edge bash
          \`\`\`

          Docker: \`docker pull surfpool/surfpool:edge\`
          NOTES_EOF
          )
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --latest=false --title "Edge $VERSION" --notes "$NOTES"
          else
            gh release create edge --prerelease --latest=false --verify-tag --title "Edge $VERSION" --notes "$NOTES"
          fi
          gh release upload edge surfpool-*.tar.gz --clobber

  image_edge:
    name: Edge Docker Image
    needs: version
    if: needs.version.outputs.channel == 'edge'
    uses: ./.github/workflows/release_image.yml
    with:
      tag: edge
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
