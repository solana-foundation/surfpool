name: Publish SDK Node Package

# On a push to main that changes package.json's version (a merged release PR),
# publishes that version. On any other push, when the NPM_EDGE_ENABLED
# repository variable is "true", publishes an edge build under the `edge`
# dist-tag. A manual run publishes whichever packages of the checked-out
# version are missing from npm.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not actually publish to npm)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  SURFPOOL_WEB_UI_VERSION: 0.2.0-alpha.0

permissions:
  contents: read

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.package.outputs.mode }}
      dist_tag: ${{ steps.package.outputs.dist_tag }}
      version: ${{ steps.package.outputs.version }}
      should_publish: ${{ steps.package.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org

      - name: Ensure npm 11
        run: |
          npm install -g npm@^11.10.0
          npm --version

      - name: Read package version
        id: package
        working-directory: crates/sdk-node
        shell: bash
        env:
          EDGE_ENABLED: ${{ github.event_name == 'push' && vars.NPM_EDGE_ENABLED == 'true' }}
          IS_PUSH: ${{ github.event_name == 'push' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          UNPUBLISHED=false
          for PACKAGE_NAME in \
            @solana/surfpool \
            @solana/surfpool-darwin-x64 \
            @solana/surfpool-darwin-arm64 \
            @solana/surfpool-linux-x64-gnu
          do
            if npm view "${PACKAGE_NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${VERSION} is already published"
            else
              echo "${PACKAGE_NAME}@${VERSION} is not published"
              UNPUBLISHED=true
            fi
          done

          # A later merge can land while the release publish waits for approval;
          # it must not publish its own code under the release version.
          BUMPED=true
          if [[ "$IS_PUSH" == "true" ]]; then
            PREVIOUS=$(git show "${BEFORE_SHA}:crates/sdk-node/package.json" 2>/dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
            [[ -n "$PREVIOUS" && "$PREVIOUS" != "$VERSION" ]] || BUMPED=false
          fi

          if [[ "$UNPUBLISHED" == "true" && "$BUMPED" == "true" ]]; then
            MODE=stable
            DIST_TAG=latest
          else
            if [[ "$UNPUBLISHED" == "true" ]]; then
              echo "::warning::${VERSION} is not fully published, but this push did not set it. Run this workflow on tag v${VERSION} to publish it."
            fi
            if [[ "$EDGE_ENABLED" == "true" ]]; then
              MODE=edge
              DIST_TAG=edge
              VERSION="$(../../.github/scripts/edge-version.sh)"
            else
              MODE=none
              DIST_TAG=latest
            fi
          fi

          echo "::notice::npm publish mode: $MODE ($VERSION)"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_publish=$([[ "$MODE" != none ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build_artifacts:
    name: Build (${{ matrix.name }})
    needs: prepare_release
    if: needs.prepare_release.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            upload_metadata: true
            platform_dir: linux-x64-gnu
          - name: macos-x64
            os: macos-15-intel
            upload_metadata: false
            platform_dir: darwin-x64
          - name: macos-arm64
            os: macos-15
            upload_metadata: false
            platform_dir: darwin-arm64

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-bin: false
          workspaces: |
            . -> target

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: crates/sdk-node/package-lock.json

      # Runs after the cache steps so their keys hash the committed lockfiles.
      - name: Stamp edge version
        if: needs.prepare_release.outputs.mode == 'edge'
        run: node .github/scripts/set-version.js "${{ needs.prepare_release.outputs.version }}"

      - name: Install npm dependencies
        working-directory: crates/sdk-node
        run: npm ci

      - name: Build npm package
        working-directory: crates/sdk-node
        run: npm run build

      - name: Smoke test package
        working-directory: crates/sdk-node
        run: npm run smoke

      - name: Verify install from packed tarballs
        working-directory: crates/sdk-node
        shell: bash
        run: |
          set -euo pipefail
          npm run create-npm-dir
          # Place the freshly built binary into its platform package so `npm pack` includes it.
          cp surfpool-sdk/surfpool-sdk.*.node "npm/${{ matrix.platform_dir }}/"
          # Build TS so the root tarball ships dist/.
          npm run build:ts
          # Platform optionalDependencies are only added at publish time (see script).
          npm run inject-platform-deps
          PACK_DIR="$(mktemp -d)"
          ROOT_TARBALL="$(npm pack --silent --pack-destination "$PACK_DIR")"
          ROOT_TARBALL_PATH="$PACK_DIR/$ROOT_TARBALL"
          pushd "npm/${{ matrix.platform_dir }}" >/dev/null
          PLATFORM_TARBALL="$(npm pack --silent --pack-destination "$PACK_DIR")"
          PLATFORM_TARBALL_PATH="$PACK_DIR/$PLATFORM_TARBALL"
          popd >/dev/null
          # Confirm the root's optionalDependencies reference the @solana/ scoped platform packages.
          node -e "
            const o = require('./package.json').optionalDependencies || {};
            const ok = Object.keys(o).every(k => k.startsWith('@solana/surfpool-'));
            if (!ok) { console.error('optionalDependencies missing @solana/ scope:', o); process.exit(1); }
          "
          INSTALL_DIR="$(mktemp -d)"
          pushd "$INSTALL_DIR" >/dev/null
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$PLATFORM_TARBALL_PATH" "$ROOT_TARBALL_PATH"
          node -e "require('@solana/surfpool'); console.log('require @solana/surfpool OK');"
          # The kit peers are optional and not auto-installed; installing them
          # here validates the documented opt-in flow for the ./kit entry.
          npm install --no-audit --no-fund "@solana/kit@^8" "@solana/kit-plugin-rpc@<1" "@solana/kit-plugin-signer@<1"
          node -e "
            const kit = require('@solana/surfpool/kit');
            if (typeof kit.surfpool !== 'function') { throw new Error('missing surfpool export'); }
            console.log('require @solana/surfpool/kit OK');
          "
          node --input-type=module -e "
            import('@solana/surfpool/kit').then(kit => {
              if (typeof kit.surfpool !== 'function') { throw new Error('missing surfpool export'); }
              console.log('import @solana/surfpool/kit OK');
            });
          "
          popd >/dev/null

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: sdk-node-${{ matrix.name }}-binary
          path: crates/sdk-node/surfpool-sdk/surfpool-sdk.*.node
          if-no-files-found: error

      - name: Upload package metadata
        if: matrix.upload_metadata
        uses: actions/upload-artifact@v4
        with:
          name: sdk-node-package-metadata
          path: |
            crates/sdk-node/surfpool-sdk/internal.js
            crates/sdk-node/surfpool-sdk/internal.d.ts
          if-no-files-found: error

  publish:
    name: Publish To npm
    needs:
      - prepare_release
      - build_artifacts
    if: needs.prepare_release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # `release` requires a reviewer; edge builds publish on every merge, so they
    # use an environment without one.
    environment: ${{ needs.prepare_release.outputs.mode == 'edge' && 'edge' || 'release' }}
    # Serializes edge publishes so the "is edge already newer?" check below
    # cannot race another run's publish.
    concurrency:
      group: npm-publish-${{ needs.prepare_release.outputs.mode }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev clang libclang-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: crates/sdk-node/package-lock.json

      - name: Ensure npm 11
        run: |
          npm install -g npm@^11.10.0
          npm --version

      - name: Stamp edge version
        if: needs.prepare_release.outputs.mode == 'edge'
        run: node .github/scripts/set-version.js "${{ needs.prepare_release.outputs.version }}"

      - name: Install publish tooling
        working-directory: crates/sdk-node
        run: npm ci

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-node-*-binary
          path: crates/sdk-node/artifacts

      - name: Download package metadata
        uses: actions/download-artifact@v4
        with:
          name: sdk-node-package-metadata
          path: crates/sdk-node/surfpool-sdk

      - name: Create npm platform package directories
        working-directory: crates/sdk-node
        run: npm run create-npm-dir

      - name: Copy artifacts into npm platform packages
        working-directory: crates/sdk-node
        run: npm run artifacts

      - name: Build TypeScript wrapper
        working-directory: crates/sdk-node
        run: npm run build:ts

      - name: Inject platform optionalDependencies
        working-directory: crates/sdk-node
        run: npm run inject-platform-deps

      - name: Pack root npm tarball
        working-directory: crates/sdk-node
        run: NPM_CONFIG_CACHE=$(mktemp -d) npm pack --dry-run

      - name: Pack platform npm tarballs
        working-directory: crates/sdk-node
        run: |
          cd npm/darwin-x64 && NPM_CONFIG_CACHE=$(mktemp -d) npm pack --dry-run
          cd ../darwin-arm64 && NPM_CONFIG_CACHE=$(mktemp -d) npm pack --dry-run
          cd ../linux-x64-gnu && NPM_CONFIG_CACHE=$(mktemp -d) npm pack --dry-run

      # Checks each package right before publishing, so re-running a partly
      # failed publish finishes the remaining packages instead of failing on
      # the ones already out.
      - name: Publish packages
        working-directory: crates/sdk-node
        env:
          MODE: ${{ needs.prepare_release.outputs.mode }}
          DIST_TAG: ${{ needs.prepare_release.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")

          # Edge versions end in the commit count on main, so a larger number is
          # a newer commit. An older run finishing late must not move `edge` back.
          if [[ "$MODE" == "edge" ]]; then
            CURRENT=$(npm view @solana/surfpool dist-tags.edge 2>/dev/null || true)
            if [[ "$CURRENT" =~ -edge\.([0-9]+)$ ]] && (( BASH_REMATCH[1] >= ${VERSION##*-edge.} )); then
              echo "::notice::Skipping ${VERSION}: edge already points at ${CURRENT}"
              exit 0
            fi
          fi

          # Platform packages first; the root package's optionalDependencies pin them.
          for DIR in npm/darwin-x64 npm/darwin-arm64 npm/linux-x64-gnu .; do
            NAME=$(node -p "require('./${DIR}/package.json').name")
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already published, skipping"
              continue
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              (cd "$DIR" && npm publish --dry-run --access public --tag "$DIST_TAG")
            else
              (cd "$DIR" && npm publish --access public --provenance --tag "$DIST_TAG")
            fi
          done
