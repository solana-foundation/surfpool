protocol: kamino
version: v1.23.0
account_type: Reserve
idl_file_path: idl.json

tags:
  - lending
  - risk-engine
  - defi

templates:
  # ==========================================
  # Reserve
  # ==========================================
  - id: kamino-reserve-state
    name: Override Reserve Liquidity & Rates
    description: Override Kamino Reserve liquidity, accrued fees and cached price
    idl_account_name: Reserve
    properties:
      - "liquidity.total_available_amount"
      - "liquidity.borrowed_amount_sf"
      - "liquidity.market_price_sf"
      - "liquidity.market_price_last_updated_ts"
      - "liquidity.cumulative_borrow_rate_bsf"
      - "liquidity.accumulated_protocol_fees_sf"
      - "liquidity.accumulated_referrer_fees_sf"
      - "liquidity.pending_referrer_fees_sf"
      - "last_update.slot"
      - "last_update.stale"
      - "last_update.price_status"
    address:
      type: pubkey
    llm_context: |
      CRITICAL: market_price_sf is a CACHE. refresh_reserve recomputes it from the configured
      oracle, so any transaction that refreshes the reserve overwrites it. Use kamino-scope-price
      for a price that survives.

      HOW TO USE THIS TEMPLATE:
      1. Set fetchBeforeUse: true so the real reserve is forked first
      2. To make the reserve look freshly refreshed, set last_update.stale: 0 and
         last_update.slot to the current slot
      3. To drain a reserve, set liquidity.total_available_amount: 0

      liquidity.cumulative_borrow_rate_bsf is a struct - supply it whole as
      {"value": [u64 x 4], "padding": [u64 x 2]}, or set one limb with
      liquidity.cumulative_borrow_rate_bsf.value.0

      EXAMPLE - "reserve has run dry" (forces the withdrawal queue):
      liquidity.total_available_amount: 0

      DO NOT set persist: true here - transactions write these fields, and re-applying the
      override reverts their writes at the start of every following slot.

  - id: kamino-reserve-config
    name: Override Reserve Risk Configuration
    description: Override Kamino Reserve LTV, liquidation thresholds and bonuses
    idl_account_name: Reserve
    properties:
      - "config.loan_to_value_pct"
      - "config.liquidation_threshold_pct"
      - "config.min_liquidation_bonus_bps"
      - "config.max_liquidation_bonus_bps"
      - "config.bad_debt_liquidation_bonus_bps"
      - "config.protocol_liquidation_fee_pct"
      - "config.borrow_factor_pct"
      - "config.min_deleveraging_bonus_bps"
      - "config.deleveraging_margin_call_period_secs"
      - "config.deleveraging_threshold_decrease_bps_per_day"
      - "config.deleveraging_bonus_increase_bps_per_day"
    address:
      type: pubkey
    llm_context: |
      Use this template to make a position liquidatable in a way that survives refresh_obligation,
      unlike the Obligation health fields.

      HOW TO USE THIS TEMPLATE:
      1. Set fetchBeforeUse: true
      2. Lower config.liquidation_threshold_pct below the borrower's current LTV
      3. Keep it >= config.loan_to_value_pct, which gates new borrows

      EXAMPLE - "liquidate anything above 50% LTV":
      config.liquidation_threshold_pct: 50
      config.max_liquidation_bonus_bps: 1000

  - id: kamino-reserve-status
    name: Override Reserve Status & Usage Flags
    description: Override Kamino Reserve status and usage restrictions
    idl_account_name: Reserve
    properties:
      - "config.status"
      - "config.block_ctoken_usage"
      - path: config.disable_usage_as_coll_outside_emode
        label: Collateral only in e-mode
        description: "1 stops this asset being used as collateral outside an elevation group. Example: 1"
      - "config.emergency_mode"
      - "config.utilization_limit_block_borrowing_above_pct"
      - "config.autodeleverage_enabled"
      - "config.proposer_authority_locked"
      - path: config.elevation_groups
        label: Elevation groups
        description: "The 20 elevation-group ids this reserve may join; 0 is empty. Example: 1"
    address:
      type: pubkey
    llm_context: |
      Use this template to disable a reserve or change its elevation-group membership.

      config.status: 0 = Active, 1 = Obsolete, 2 = Hidden. Marking a reserve Obsolete exercises the
      num_of_obsolete_deposit_reserves / num_of_obsolete_borrow_reserves paths on an Obligation.

      config.elevation_groups is a fixed [u8; 20] array - supply all 20 entries, or one slot with
      config.elevation_groups.0

      EXAMPLE - "reserve is deprecated":
      config.status: 1

  - id: kamino-reserve-limits
    name: Override Reserve Deposit & Borrow Limits
    description: Override Kamino Reserve caps and the withdrawal queue
    idl_account_name: Reserve
    properties:
      - "config.deposit_limit"
      - "config.borrow_limit"
      - "config.borrow_limit_outside_elevation_group"
      - path: config.deposit_withdrawal_cap.config_capacity
        label: Deposit cap per interval
        description: "Maximum that may be deposited per interval, in the token's smallest unit. Example: -1"
      - path: config.deposit_withdrawal_cap.current_total
        label: Deposited this interval
        description: "Running total deposited in the current interval. Example: 0"
      - path: config.deposit_withdrawal_cap.config_interval_length_seconds
        label: Deposit cap window
        description: "Length of the deposit cap window, in seconds. Example: 86400"
      - path: config.deposit_withdrawal_cap.last_interval_start_timestamp
        label: Deposit window start
        description: "When the current deposit window opened (unix seconds). Example: 1800000000"
      - path: config.debt_withdrawal_cap.config_capacity
        label: Borrow cap per interval
        description: "Maximum that may be borrowed per interval, smallest unit. Example: -1"
      - path: config.debt_withdrawal_cap.current_total
        label: Borrowed this interval
        description: "Running total borrowed in the current interval. Example: 0"
      - path: config.debt_withdrawal_cap.config_interval_length_seconds
        label: Borrow cap window
        description: "Length of the borrow cap window, in seconds. Example: 86400"
      - path: config.debt_withdrawal_cap.last_interval_start_timestamp
        label: Borrow window start
        description: "When the current borrow window opened (unix seconds). Example: 1800000000"
      - "liquidity.deposit_limit_crossed_timestamp"
      - "liquidity.borrow_limit_crossed_timestamp"
      - path: borrowed_amount_outside_elevation_group
        label: Borrowed outside e-mode
        description: >-
          Amount borrowed against this reserve by obligations not in an elevation group, smallest unit.
          Example: 0
      - "withdraw_queue.queued_collateral_amount"
      - "withdraw_queue.next_issued_ticket_sequence_number"
      - "withdraw_queue.next_withdrawable_ticket_sequence_number"
    address:
      type: pubkey
    llm_context: |
      Use this template for borrow/deposit caps and for the queued-withdrawal feature.

      HOW TO USE THIS TEMPLATE (queued withdrawals, klend 1.23.0):
      1. Drain the reserve with kamino-reserve-state (liquidity.total_available_amount: 0)
      2. Enable the feature on kamino-lending-market-risk (withdraw_ticket_issuance_enabled: 1)
      3. Set withdraw_queue.next_withdrawable_ticket_sequence_number to serve a ticket
      4. Build the ticket itself with kamino-withdraw-ticket

      Set a config_capacity of -1 to disable a withdrawal cap.

      EXAMPLE - "no new borrows against this reserve":
      config.borrow_limit: 0

  - id: kamino-reserve-fees
    name: Override Reserve Fees
    description: Override Kamino Reserve origination, flash-loan and protocol fees
    idl_account_name: Reserve
    properties:
      - "config.fees.origination_fee_sf"
      - "config.fees.flash_loan_fee_sf"
      - "config.host_fixed_interest_rate_bps"
      - "config.protocol_take_rate_pct"
      - "config.protocol_order_execution_fee_pct"
    address:
      type: pubkey
    llm_context: |
      Use this template to remove fee noise from an arbitrage simulation.

      Fees ending in _sf are scaled fractions: a 0.3% flash-loan fee is 0.003 * 2^60.

      EXAMPLE - "free flash loans" so only the swap legs decide profitability:
      config.fees.flash_loan_fee_sf: 0
      config.fees.origination_fee_sf: 0

  - id: kamino-reserve-interest-rate
    name: Override Reserve Borrow Rate Curve
    description: Override the Kamino Reserve borrow-rate curve
    idl_account_name: Reserve
    properties:
      - "config.borrow_rate_curve"
    address:
      type: pubkey
    llm_context: |
      config.borrow_rate_curve is a struct with one field, points, a fixed array of EXACTLY 11
      CurvePoint entries sorted by ascending utilization_rate_bps. Pad the tail by repeating the
      final point, which Kamino treats as the end of the curve.

      HOW TO USE THIS TEMPLATE:
      1. Prefer an element path to change one point, e.g.
         config.borrow_rate_curve.points.3.borrow_rate_bps
      2. Only supply the whole struct if you are replacing the entire curve

      EXAMPLE - raise the borrow rate at the 4th curve point to 50%:
      config.borrow_rate_curve.points.3.borrow_rate_bps: 5000

  - id: kamino-reserve-oracle
    name: Override Reserve Oracle Configuration
    description: Override which oracle a Kamino Reserve reads, and its staleness guards
    idl_account_name: Reserve
    properties:
      - "config.token_info.scope_configuration.price_feed"
      - "config.token_info.scope_configuration.price_chain"
      - "config.token_info.scope_configuration.twap_chain"
      - "config.token_info.pyth_configuration.price"
      - "config.token_info.switchboard_configuration.price_aggregator"
      - path: config.token_info.switchboard_configuration.twap_aggregator
        label: Switchboard TWAP feed
        description: >-
          Switchboard aggregator supplying a TWAP for this token. Example: the aggregator address, or
          the default pubkey to disable
      - path: config.token_info.max_age_price_seconds
        label: Max price age
        description: "How old the oracle price may be before Kamino refuses it, in seconds. Example: 600"
      - path: config.token_info.max_age_twap_seconds
        label: Max TWAP age
        description: "How old the TWAP may be before Kamino refuses it, in seconds. Example: 600"
      - "config.token_info.max_twap_divergence_bps"
      - path: config.token_info.block_price_usage
        label: Block price usage
        description: >-
          1 stops this token's price being used at all, which freezes borrowing against it. Example: 1
      - "config.token_info.heuristic.lower"
      - "config.token_info.heuristic.upper"
      - "config.token_info.heuristic.exp"
    address:
      type: pubkey
    llm_context: |
      Use this template to change WHICH oracle a reserve reads, rather than the price itself.

      HOW TO USE THIS TEMPLATE:
      1. To drive the price from a Pyth feed you already control, set
         config.token_info.pyth_configuration.price to that feed and use the pyth-price-feed-v2
         template to move it - this survives refresh_reserve
      2. To fix a stale-price rejection, raise config.token_info.max_age_price_seconds
      3. To fix a TWAP divergence rejection, raise config.token_info.max_twap_divergence_bps

      price_chain and twap_chain are fixed [u16; 4] arrays - supply all 4, or one entry with
      config.token_info.scope_configuration.price_chain.0 (65535 = unused)

      EXAMPLE - "accept prices up to an hour old":
      config.token_info.max_age_price_seconds: 3600

  - id: kamino-reserve-rewards
    name: Override Reserve Reward Emissions
    description: Override Kamino Reserve reward emissions
    idl_account_name: Reserve
    properties:
      - "config.rewards_amount_per_slot"
      - "liquidity.rewards_amount_available"
    address:
      type: pubkey
    llm_context: |
      Reserve-level rewards (klend 1.23.0) are separate from Kamino Farms - use the kamino-farms-*
      templates for those.

      HOW TO USE THIS TEMPLATE:
      1. Set config.rewards_amount_per_slot to the emission rate (smallest unit per slot, ~2.5
         slots per second)
      2. Raise liquidity.rewards_amount_available too, or emissions stop when the budget empties
      3. Check reserve_rewards_max_apr_bps on kamino-lending-market-risk is not capping you

      EXAMPLE - "emit 1 USDC per second to depositors" (6 decimals, ~2.5 slots/sec):
      config.rewards_amount_per_slot: 400000
      liquidity.rewards_amount_available: 1000000000

  - id: kamino-reserve-debt-term
    name: Override Reserve Fixed-Term Debt Settings
    description: Override Kamino Reserve fixed-term debt settings
    idl_account_name: Reserve
    properties:
      - "config.debt_term_seconds"
      - "config.debt_maturity_timestamp"
      - "config.early_repay_remaining_interest_pct"
    address:
      type: pubkey
    llm_context: |
      Fixed-term borrowing arrived in klend 1.23.0. A debt_term_seconds of 0 means the reserve uses
      open-term (perpetual) loans.

      HOW TO USE THIS TEMPLATE:
      1. Set config.debt_maturity_timestamp to a unix timestamp in the past so outstanding
         fixed-term debt matures immediately
      2. Enable mature_reserve_debt_liquidation_enabled on kamino-lending-market-risk, or the
         maturity liquidation path stays inactive

      EXAMPLE - "this debt matured yesterday":
      config.debt_maturity_timestamp: 1799913600

  - id: kamino-withdraw-ticket
    name: Override Withdraw Ticket
    description: Override a Kamino queued-withdrawal ticket
    idl_account_name: WithdrawTicket
    properties:
      - "sequence_number"
      - "owner"
      - "reserve"
      - "user_destination_liquidity_ta"
      - "queued_collateral_amount"
      - "created_at_timestamp"
      - "invalid"
      - "progress_callback_type"
    address:
      type: pubkey
    llm_context: |
      CRITICAL: No live WithdrawTicket existed on mainnet when this template was written. Build one
      with surfnet_setAccount rather than expecting to fork one.

      HOW TO USE THIS TEMPLATE:
      1. Set owner and user_destination_liquidity_ta - the destination must be a real token account
         for the reserve's liquidity mint
      2. To make the ticket redeemable, set sequence_number at or below the reserve's
         withdraw_queue.next_withdrawable_ticket_sequence_number (kamino-reserve-limits)
      3. To test the not-yet-your-turn rejection, set it above

      EXAMPLE - "ticket 7 is next in line, waiting on 500 collateral":
      sequence_number: 7
      queued_collateral_amount: 500
      invalid: 0

      DO NOT set persist: true here - transactions write these fields, and re-applying the
      override reverts their writes at the start of every following slot.

  # ==========================================
  # Named reserves - addresses pre-filled
  # ==========================================
  # Kamino reserves are NOT PDAs (see `init_reserve` in the IDL: the reserve account is a plain
  # keypair account), so an address cannot be derived from a token mint. The only way to spare a
  # user the lookup is to bake in known addresses, the same approach the whirlpool templates take.
  #
  # These are facts about mainnet as captured on 2026-08-06, verified by decoding each account
  # with the bundled IDL: every address below is an active Reserve owned by
  # KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD, and every Scope index below was checked to
  # produce the reserve's own cached price. Re-verify if Kamino migrates a market.
  #
  # Only the canonical demo pair is baked in; six near-duplicates implied a "supported set" that
  # does not exist. For any other reserve use the generic `kamino-reserve-*` templates and supply
  # the address - see their llm_context for how to find one.

  - id: kamino-reserve-main-sol
    name: Override SOL Reserve (Main Market)
    description: Override the SOL reserve of Kamino's Main Market
    idl_account_name: Reserve
    properties:
      - "config.loan_to_value_pct"
      - "config.liquidation_threshold_pct"
      - "config.min_liquidation_bonus_bps"
      - "config.max_liquidation_bonus_bps"
      - path: config.token_info.max_age_price_seconds
        label: Max price age
        description: "How old the oracle price may be before Kamino refuses it, in seconds. Example: 600"
      - "liquidity.market_price_sf"
      - "liquidity.total_available_amount"
      - "last_update.slot"
      - "last_update.stale"
    address:
      type: pubkey
      value: d4A2prbA2whesmvHaL88BH6Ewn5N4bTSU2Ze8P6Bc4Q
    llm_context: |
      The SOL reserve of Kamino's Main Market, address already filled in - no lookup needed.

      HOW TO USE THIS TEMPLATE:
      1. Set fetchBeforeUse: true
      2. Lower config.liquidation_threshold_pct below the borrower's LTV - this survives
         refresh_obligation, unlike the Obligation's own health fields
      3. To move the price, use kamino-scope-price on account
         3t4JZcueEzTbVP6kLxXrL3VpWx45jDer4eqysweBchNH with prices.3.price.value (SOL is index 3)

      EXAMPLE - "liquidate SOL collateral above 50% LTV":
      config.liquidation_threshold_pct: 50

      persist: true is safe for the config.* fields only. liquidity.* and last_update.* are
      rewritten by refresh_reserve, so pinning them fights every transaction that touches the reserve.
  - id: kamino-reserve-main-usdc
    name: Override USDC Reserve (Main Market)
    description: Override the USDC reserve of Kamino's Main Market
    idl_account_name: Reserve
    properties:
      - "config.loan_to_value_pct"
      - "config.liquidation_threshold_pct"
      - "config.min_liquidation_bonus_bps"
      - "config.max_liquidation_bonus_bps"
      - path: config.token_info.max_age_price_seconds
        label: Max price age
        description: "How old the oracle price may be before Kamino refuses it, in seconds. Example: 600"
      - "liquidity.market_price_sf"
      - "liquidity.total_available_amount"
      - "last_update.slot"
      - "last_update.stale"
    address:
      type: pubkey
      value: D6q6wuQSrifJKZYpR1M8R4YawnLDtDsMmWM1NbBmgJ59
    llm_context: |
      The USDC reserve of Kamino's Main Market, address already filled in - no lookup needed.

      HOW TO USE THIS TEMPLATE:
      1. Set fetchBeforeUse: true
      2. Lower config.liquidation_threshold_pct below the borrower's LTV - this survives
         refresh_obligation, unlike the Obligation's own health fields
      3. To move the price, use kamino-scope-price on account
         3t4JZcueEzTbVP6kLxXrL3VpWx45jDer4eqysweBchNH with prices.13.price.value (USDC is index 13)

      EXAMPLE - "USDC depegs to $0.90":
      use kamino-scope-price with prices.13.price.value: 90000000 and prices.13.price.exp: 8

      persist: true is safe for the config.* fields only. liquidity.* and last_update.* are
      rewritten by refresh_reserve, so pinning them fights every transaction that touches the reserve.
  # ==========================================
  # Obligation
  # ==========================================
  - id: kamino-obligation-health
    name: Override Obligation Health
    description: Override Kamino Obligation health metrics
    idl_account_name: Obligation
    properties:
      - "last_update.slot"
      - "last_update.stale"
      - "deposited_value_sf"
      - "borrow_factor_adjusted_debt_value_sf"
      - "borrowed_assets_market_value_sf"
      - "allowed_borrow_value_sf"
      - "unhealthy_borrow_value_sf"
      - "lowest_reserve_deposit_liquidation_ltv"
      - "lowest_reserve_deposit_max_ltv_pct"
      - path: highest_borrow_factor_pct
        label: Highest borrow factor
        description: "The largest borrow factor across this obligation's debts, as a percent. Example: 100"
      - "borrowing_disabled"
      - "num_of_obsolete_deposit_reserves"
      - "num_of_obsolete_borrow_reserves"
      - "autodeleverage_target_ltv_pct"
    address:
      type: pubkey
    llm_context: |
      CRITICAL: These are DERIVED values. refresh_obligation recomputes every one of them from the
      positions and reserves, and liquidation instructions reject a stale obligation - so a
      realistic liquidation transaction discards these overrides.

      TO MAKE A POSITION LIQUIDATABLE DURABLY, use one of these instead:
      - kamino-reserve-config: lower config.liquidation_threshold_pct on the deposit reserve
      - kamino-scope-price: move the price the reserve reads

      Use this template only for assertions that do not refresh. All *_sf values are scaled
      fractions: usd_value * 2^60.

      EXAMPLE - force an unhealthy obligation for a direct state check ($1000 debt vs $500 limit):
      borrow_factor_adjusted_debt_value_sf: "1152921504606846976000"
      unhealthy_borrow_value_sf: "576460752303423488000"

      DO NOT set persist: true here - transactions write these fields, and re-applying the
      override reverts their writes at the start of every following slot.

  - id: kamino-obligation-positions
    name: Override Obligation Positions
    description: Override the deposits and borrows of a Kamino Obligation
    idl_account_name: Obligation
    properties:
      - "tag"
      - "lending_market"
      - "owner"
      - "referrer"
      - "deposits"
      - "borrows"
      - "has_debt"
      - "elevation_group"
    address:
      type: pubkey
    llm_context: |
      CRITICAL: Prefer element paths. Supplying a whole array requires it COMPLETE - every field of
      every element including padding, with unused slots all-zero and the reserve set to
      11111111111111111111111111111111

      HOW TO USE THIS TEMPLATE:
      1. Set one position with deposits.0.deposit_reserve and deposits.0.deposited_amount
      2. Set the matching debt with borrows.0.borrow_reserve and borrows.0.borrowed_amount_sf
      3. Set has_debt: 1 whenever any borrow slot is populated

      Array sizes: deposits = 8 slots, borrows = 5 slots.

      EXAMPLE - "10 SOL deposited against the Main Market SOL reserve":
      deposits.0.deposit_reserve: d4A2prbA2whesmvHaL88BH6Ewn5N4bTSU2Ze8P6Bc4Q
      deposits.0.deposited_amount: 10000000000
      has_debt: 1

      DO NOT set persist: true here - transactions write these fields, and re-applying the
      override reverts their writes at the start of every following slot.

  - id: kamino-obligation-orders
    name: Override Obligation Orders
    description: Override Kamino Obligation stop-loss and take-profit orders
    idl_account_name: Obligation
    properties:
      - "obligation_orders"
      - "autodeleverage_margin_call_started_timestamp"
      - "autodeleverage_target_ltv_pct"
    address:
      type: pubkey
    llm_context: |
      obligation_orders is a fixed array of EXACTLY 2 entries. Prefer element paths for a single
      order. An all-zero entry is an empty slot.

      HOW TO USE THIS TEMPLATE:
      1. Set obligation_orders.0.condition_threshold_sf and obligation_orders.0.condition_type
      2. Enable obligation_order_execution_enabled on kamino-lending-market-risk, or the order
         never executes

      EXAMPLE - arm a stop-loss on the first order slot:
      obligation_orders.0.condition_threshold_sf: "576460752303423488000"
      obligation_orders.0.min_execution_bonus_bps: 100

  # ==========================================
  # LendingMarket
  # ==========================================
  - id: kamino-lending-market-risk
    name: Override Lending Market Risk Controls
    description: Override Kamino market-wide switches and liquidation limits
    idl_account_name: LendingMarket
    properties:
      - path: emergency_mode
        label: Emergency mode
        description: "1 blocks deposits, borrows and withdrawals; liquidations still allowed. Example: 1"
      - path: borrow_disabled
        label: Borrowing disabled
        description: >-
          1 blocks all new borrows market-wide without touching deposits or withdrawals. Example: 1
      - "autodeleverage_enabled"
      - "price_refresh_trigger_to_max_age_pct"
      - "liquidation_max_debt_close_factor_pct"
      - "insolvency_risk_unhealthy_ltv_pct"
      - "min_full_liquidation_value_threshold"
      - "max_liquidatable_debt_market_value_at_once"
      - "global_allowed_borrow_value"
      - "referral_fee_bps"
      - "min_value_skip_liquidation_ltv_checks"
      - "min_value_skip_liquidation_bf_checks"
      - "min_net_value_in_obligation_sf"
      - "min_initial_deposit_amount"
      - "reserve_rewards_max_apr_bps"
      - "obligation_order_execution_enabled"
      - "obligation_order_creation_enabled"
      - "price_triggered_liquidation_disabled"
      - "withdraw_ticket_issuance_enabled"
      - "withdraw_ticket_redemption_enabled"
      - "withdraw_ticket_cancellation_enabled"
      - "min_withdraw_queued_liquidity_value"
      - "mature_reserve_debt_liquidation_enabled"
      - "term_based_full_liquidation_duration_secs"
      - "individual_autodeleverage_margin_call_period_secs"
    address:
      type: pubkey
    llm_context: |
      Use this template for market-wide switches, including the gates for two klend 1.23.0 features
      that are otherwise configured but never active:
      - withdraw_ticket_issuance_enabled / _redemption_enabled / _cancellation_enabled gate the
        queued withdrawals set up by kamino-reserve-limits and kamino-withdraw-ticket
      - mature_reserve_debt_liquidation_enabled gates the maturity liquidation set up by
        kamino-reserve-debt-term

      EXAMPLE - "allow a full position to be closed in one liquidation":
      liquidation_max_debt_close_factor_pct: 100

      EXAMPLE - "wind-down mode" (blocks deposits, borrows and withdrawals, still allows liquidation):
      emergency_mode: 1

  - id: kamino-lending-market-elevation-groups
    name: Override Lending Market Elevation Groups
    description: Override Kamino e-mode elevation groups
    idl_account_name: LendingMarket
    properties:
      - "elevation_groups"
    address:
      type: pubkey
    llm_context: |
      elevation_groups is a fixed array of EXACTLY 32 entries. Index 0 is the reserved
      no-elevation-group slot and its id must stay 0. Prefer element paths for a single group.

      An obligation opts in via elevation_group on kamino-obligation-positions, and the group's
      values then override the per-reserve ones.

      EXAMPLE - "e-mode group 1 allows 90% LTV, liquidating at 95%":
      elevation_groups.1.ltv_pct: 90
      elevation_groups.1.liquidation_threshold_pct: 95
      elevation_groups.1.allow_new_loans: 1

