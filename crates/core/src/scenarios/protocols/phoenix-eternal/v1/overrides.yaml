protocol: Phoenix Eternal
version: v1
account_type: Trader
idl_file_path: idl.json

tags:
  - perpetuals
  - collateral
  - risk

templates:
  - id: phoenix-oracle-price
    name: Phoenix Oracle Price
    description: >-
      Set one Phoenix Eternal market's oracle price, in ticks or as a percentage change. Only the
      oracles move: the order book and the makers' quotes stay where they are.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: target_ticks
        type: input
        value_type: string
        label: Oracle Price (ticks)
        description: The new price in ticks, at least 1; leave empty to give a percentage instead
      - path: change_percent
        type: input
        value_type: string
        label: Change (%)
        description: >-
          Change from the current mark in percent, for example -5 or 2.5; leave
          empty to give ticks instead
    llm_context: |
      Every oracle key that reports the market sends the new price through Phoenix's own oracle
      update, and Phoenix recomputes the mark from it. Nothing else moves: makers keep their
      quotes and resting orders keep their prices, so a trade or liquidation right after fills
      against the old book. Use phoenix-market-move and phoenix-market-uncross when the book
      should follow the price.
      Give exactly one of target_ticks and change_percent, as a decimal string. change_percent is
      applied to the market's mark when the override plays, so moves at later slots add up.
      USD per base unit = ticks * tickSize * 10^(baseLotDecimals - 6), all from
      list_phoenix_markets.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-move
    name: Phoenix Market Move
    description: >-
      Move one Phoenix Eternal market to a new price the way mainnet moves it: oracle reports and
      maker liquidity. Resting orders the new price crosses stay until phoenix-market-uncross.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: target_ticks
        type: input
        value_type: string
        label: Target Price (ticks)
        description: The new price in ticks, at least 1, encoded as a decimal string
    llm_context: |
      This runs Phoenix's own instructions: every oracle key that reports the market sends the new
      price and every active market maker re-centres its spline liquidity on it. Resting orders on
      the other side of the new price stay crossed, and trades and liquidations fill against them
      at their old prices, until phoenix-market-uncross matches them: add it right after this
      override, in the same slot.
      USD per base unit = ticks * tickSize * 10^(baseLotDecimals - 6), all from
      list_phoenix_markets; compute a relative move from markTicks there.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-uncross
    name: Phoenix Market Uncross
    description: >-
      Match the resting orders a price move left crossed in one Phoenix Eternal market with
      Phoenix's uncross crank, which anyone can send.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
    llm_context: |
      Runs Phoenix's uncross crank on the market until the book is uncrossed or a crank matches
      nothing more. After phoenix-market-move the makers quote around the new price while resting
      orders on the other side of it stay crossed; this matches them, so the best bid and ask
      end up around the target. Add it right after phoenix-market-move, in the same slot.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-trader-cancel-orders
    name: Phoenix Trader Cancel Orders
    description: >-
      Cancel all resting orders of a Phoenix Eternal trader, as the trader, on every market, on one
      market or on several. On every market it takes the trader out of Phoenix's active trader
      index. Positions stay open.
    idl_account_name: PerpAssetMap
    properties:
      - path: trader
        type: input
        value_type: string
        label: Trader Account
        description: The trader's Trader account address, as list_phoenix_trader_positions takes it
      - path: symbol
        type: input
        value_type: string
        label: Market Symbols
        description: Empty for every market, one symbol such as SOL, or several separated by commas such as SOL, BTC, ETH; symbols from list_phoenix_markets
    llm_context: |
      Runs Phoenix's CancelAll as the trader on every market where it holds a position or resting
      orders when symbol is empty, or only on the markets symbol names: one, such as SOL, or
      several separated by commas, such as SOL, BTC, ETH. Canceled on every market, a trader the
      active trader index lists (hot: true in list_phoenix_trader_positions) leaves it, and
      Phoenix reads its state from the Trader account again; canceled on some markets, it stays
      in the index while it has orders elsewhere. A cold trader has no resting orders and nothing
      changes. A keeper cannot liquidate a trader with risk-increasing resting orders on any
      market until it force-cancels them, which Phoenix allows any signer while the trader is
      liquidatable. With phoenix-trader-collateral for the same trader, put this first, in the
      same slot. Before a price move that should make a trader liquidatable, leave symbol empty,
      so the move cannot fill the trader's orders and change its positions.
      A cancel freezes the mark for risk in its slot: play phoenix-market-move at a later slot.
      A trader Phoenix still lists after a cancel on every market, such as a spline market maker,
      is refused. An unknown symbol refuses the whole override, so nothing is canceled.
      Set trader to the trader's Trader account; the override's own account is the PerpAssetMap,
      as for the market templates.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-trader-collateral
    name: Phoenix Trader Collateral
    description: >-
      Set one Phoenix Eternal trader's effective collateral in USDC, which sets its distance from
      liquidation, with or without resting orders.
    idl_account_name: Trader
    properties:
      - path: effective_collateral_usdc
        type: input
        value_type: string
        label: Effective Collateral (USDC)
        description: The effective collateral when the override plays, such as 750.5; it can be negative
    llm_context: |
      Brings the trader's effective collateral, which Phoenix measures margin against, to
      effective_collateral_usdc when the override plays: it reads Hawkeye's effective collateral
      then and moves the collateral field by the difference, where Phoenix reads it, the Trader
      account or, for a trader Phoenix's active trader index lists (hot: true), its record there.
      Effective collateral moves one for one with that field, so the value lands even with
      funding pending or resting orders. list_phoenix_trader_positions reports quote lots, and 1
      USDC is 1000000 quote lots: effective_collateral_usdc = target / 1000000.
      Take the target from the tool's margin, the trader with its orders canceled, in the middle
      of a range, as the state can drift a little before the keeper acts: between backstopMargin
      and maintenanceMargin, one keeper liquidation makes the account healthy again; between
      highRiskMargin and backstopMargin, a keeper can liquidate every position. Below
      highRiskMargin a liquidation can leave the trader underwater and fail, and below 0 Phoenix
      refuses it. A keeper force-cancels a trader's risk-increasing orders before it liquidates.
      A scenario that also cancels the trader's orders puts phoenix-trader-cancel-orders before
      this override, in the same slot: a cancel moves the effective collateral a little, and this
      override lands on its target after it.
      To have a trader cross on a phoenix-market-move and phoenix-market-uncross at a later slot,
      call the tool with moves, put phoenix-trader-cancel-orders before this override in the same
      slot, and set effective_collateral_usdc to wanted / 1000000, where wanted =
      margin.effectiveCollateral - marginAfterMoves.effectiveCollateral + target in quote lots,
      with target in a range of marginAfterMoves; wanted must stay above margin.maintenanceMargin
      so the trader is healthy until the move.
      A spline market maker is refused. A collateral above the current one is not backed by the
      global vault, so a later withdrawal could take funds the vault does not count.
      The account is the trader's Trader account.
      Leave fetchBeforeUse false: a refetch drops earlier Phoenix changes to this trader. Call
      list_phoenix_trader_positions first; it loads the trader into the surfnet.
    address:
      type: pubkey

  - id: phoenix-market-risk-factors
    name: Phoenix Market Risk Factors
    description: >-
      Set one market's maintenance, backstop and high-risk factors, which decide its liquidation tiers.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: maintenanceRiskFactor
        type: input
        value_type: string
        label: Maintenance factor (bps)
        description: >-
          Basis points of the initial margin, at most the cancel order factor (7500 on mainnet);
          mainnet markets use 5000
      - path: backstopRiskFactor
        type: input
        value_type: string
        label: Backstop factor (bps)
        description: >-
          Basis points of the initial margin, below the maintenance factor; mainnet uses 2000
      - path: highRiskRiskFactor
        type: input
        value_type: string
        label: High-risk factor (bps)
        description: >-
          Basis points of the initial margin, below the backstop factor; mainnet uses 1000
    llm_context: |
      The three factors set the Liquidatable, BackstopLiquidatable and HighRisk tiers; keep them in
      that descending order. Phoenix also refuses a maintenance factor above the market's cancel
      order risk factor (7500 on mainnet); raise that first with phoenix-market-cancel-risk-factor.
      list_phoenix_markets shows the current maintenance and backstop factors. Pass every factor
      as a decimal string.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-cancel-risk-factor
    name: Phoenix Cancel Order Risk Factor
    description: >-
      Set the risk factor of one market's resting orders, the ceiling for its maintenance factor.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: cancelOrderRiskFactor
        type: input
        value_type: string
        label: Cancel order factor (bps)
        description: >-
          Basis points; mainnet markets use 7500. Example: 10000
    llm_context: |
      Phoenix keeps every maintenance factor at or below this one, so raise it before setting a
      maintenance factor above 7500. Pass the factor as a decimal string.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-max-liquidation-size
    name: Phoenix Max Liquidation Size
    description: >-
      Set the most base lots one liquidation may close in a market.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: maxLiquidationSize
        type: input
        value_type: string
        label: Max liquidation size (base lots)
        description: >-
          Base lots one liquidate_via_market_order may close; mainnet SOL allows 500000
    llm_context: |
      A keeper's liquidation asking for more is refused, so a small value forces a large position to
      be liquidated in several steps. Pass the size as a decimal string.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-open-interest-cap
    name: Phoenix Open Interest Cap
    description: >-
      Set the most open interest a market accepts, in base lots.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: openInterestCap
        type: input
        value_type: string
        label: Open interest cap (base lots)
        description: >-
          The most open interest the market accepts
    llm_context: |
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-funding
    name: Phoenix Market Funding
    description: >-
      Set one market's funding interval, funding period and maximum funding rate.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: fundingIntervalSeconds
        type: input
        value_type: string
        label: Funding interval (seconds)
        description: >-
          Leave empty to keep the current value
      - path: fundingPeriodSeconds
        type: input
        value_type: string
        label: Funding period (seconds)
        description: >-
          Leave empty to keep the current value
      - path: maxFundingRate
        type: input
        value_type: string
        label: Max funding rate (quote lots per base lot)
        description: >-
          Signed; leave empty to keep the current value
    llm_context: |
      Every field is optional: one left out keeps its current value. Pass values as decimal strings.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-fees
    name: Phoenix Market Fees
    description: >-
      Set one market's default taker and maker fees.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: defaultTakerFeeMicro
        type: input
        value_type: string
        label: Taker fee (micro)
        description: >-
          Millionths of the filled notional; mainnet markets use 350 (0.035%). Example: 1000
      - path: defaultMakerFeeMicro
        type: input
        value_type: string
        label: Maker fee (micro)
        description: >-
          Millionths of the filled notional, negative for a rebate; mainnet uses 50. Example: -50
    llm_context: |
      This changes the fees a market charges on every fill. It does not change per-trader fee
      overrides. A fee left out keeps its current value. Keep the maker fee below the taker fee.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-market-status
    name: Phoenix Market Status
    description: >-
      Pause a market, make it post-only, or activate it again.
    idl_account_name: PerpAssetMap
    properties:
      - path: symbol
        type: dynamic_ref
        label: Market Symbol
        source: list_phoenix_markets
        description: Exact Phoenix market symbol
      - path: nextMarketStatus
        type: input
        value_type: string
        label: Market status
        description: >-
          Active, PostOnly, Paused or Closed
    llm_context: |
      Paused stops all trading in the market, PostOnly accepts only orders that rest on the book,
      and Active trades normally. Closed and Tombstoned are one-way steps toward removing a market.
      Leave fetchBeforeUse false: a refetch puts every market's prices and factors back to
      mainnet's while their order books keep earlier moves. list_phoenix_markets loads the map.
    address:
      type: pubkey
      value: 2nHGAaEw3D5dd4hVueaUNoygkQFmoeKqRQWnSPqSMFUC

  - id: phoenix-exchange-status
    name: Phoenix Exchange Status
    description: >-
      Switch the exchange-wide active, gated and maintenance flags.
    idl_account_name: GlobalConfiguration
    properties:
      - path: active
        type: input
        value_type: string
        label: Active
        description: >-
          true or false; leave empty to keep it
      - path: gated
        type: input
        value_type: string
        label: Gated
        description: >-
          true or false; leave empty to keep it
      - path: maintenance
        type: input
        value_type: string
        label: Maintenance
        description: >-
          true or false; leave empty to keep it
    llm_context: |
      Each flag left out keeps its current value. An inactive exchange refuses trading for everyone.
      Use fetchBeforeUse: true the first time a scenario changes this account on a surfnet, false
      after that. It stands alone, so a refetch only drops earlier changes to it.
    address:
      type: pubkey
      value: 2zskx2iyCvb6Stg7RBZkt1f6MrF4dpYtMG3yMvKwqtUZ

  - id: phoenix-withdraw-limits
    name: Phoenix Withdraw Limits
    description: >-
      Set the exchange-wide withdrawal budget and how fast it refills.
    idl_account_name: WithdrawQueueHeader
    properties:
      - path: maxBudget
        type: input
        value_type: string
        label: Max withdraw budget
        description: >-
          Quote lots withdrawable before requests queue (1000000 = 1 USDC). Mainnet: 2000000000000
      - path: replenishAmountPerSlot
        type: input
        value_type: string
        label: Budget refill per slot
        description: >-
          Quote lots added back each slot. Mainnet: 450000000 (450 USDC)
    llm_context: |
      This throttles withdrawals for every trader, for example a bank run where withdrawals queue
      instead of paying out. A withdrawal is paid at once only when the queue is empty and it fits
      the remaining budget; otherwise it waits for the permissionless ConsumeWithdrawQueue.
      A field left out keeps its current value. Amounts are quote lots of Phoenix USDC with
      6 decimals, passed as decimal strings.
      Use fetchBeforeUse: true the first time a scenario changes this account on a surfnet, false
      after that. It stands alone, so a refetch only drops earlier changes to it.
    address:
      type: pubkey
      value: 3c3NTwpg7yW91FxijkHBXwVH1xUifun3Z8TC5eW5Si3K

  - id: phoenix-withdraw-parameters
    name: Phoenix Withdraw Parameters
    description: >-
      Set the deposit cooldown and the withdrawal and queueing fees.
    idl_account_name: WithdrawQueueHeader
    properties:
      - path: depositCooldownPeriodInSlots
        type: input
        value_type: string
        label: Deposit cooldown (slots)
        description: >-
          Slots after a deposit before the trader may withdraw
      - path: withdrawalFee
        type: input
        value_type: string
        label: Withdrawal fee
        description: >-
          Quote lots charged per withdrawal. Mainnet: 500000 (0.5 USDC)
      - path: enqueueingFee
        type: input
        value_type: string
        label: Queueing fee
        description: >-
          Quote lots charged when a withdrawal is queued. Mainnet: 500000
    llm_context: |
      A field left out keeps its current value. Pass values as decimal strings.
      Use fetchBeforeUse: true the first time a scenario changes this account on a surfnet, false
      after that. It stands alone, so a refetch only drops earlier changes to it.
    address:
      type: pubkey
      value: 3c3NTwpg7yW91FxijkHBXwVH1xUifun3Z8TC5eW5Si3K

  - id: phoenix-trader-fees
    name: Phoenix Trader Fees
    description: >-
      Set one trader's maker and taker fee override multipliers.
    idl_account_name: Trader
    properties:
      - path: makerFeeOverrideMultiplier
        type: input
        value_type: string
        label: Maker fee multiplier
        description: >-
          Signed 8-bit multiplier as Phoenix defines it
      - path: takerFeeOverrideMultiplier
        type: input
        value_type: string
        label: Taker fee multiplier
        description: >-
          Signed 8-bit multiplier as Phoenix defines it
    llm_context: |
      Both multipliers are required. Pass them as decimal strings.
      The account is the trader's Trader account.
      Leave fetchBeforeUse false: a refetch drops earlier Phoenix changes to this trader. Call
      list_phoenix_trader_positions first; it loads the trader into the surfnet.
    address:
      type: pubkey

  - id: phoenix-trader-capabilities
    name: Phoenix Trader Capabilities
    description: >-
      Allow or block what one trader may do: orders, risk-increasing trades, deposits, withdrawals.
    idl_account_name: Trader
    properties:
      - path: PlaceLimitOrder
        type: input
        value_type: string
        label: PlaceLimitOrder
        description: >-
          true or false; leave empty to keep it
      - path: PlaceMarketOrder
        type: input
        value_type: string
        label: PlaceMarketOrder
        description: >-
          true or false; leave empty to keep it
      - path: RiskIncreasingTrade
        type: input
        value_type: string
        label: RiskIncreasingTrade
        description: >-
          true or false; leave empty to keep it
      - path: RiskReducingTrade
        type: input
        value_type: string
        label: RiskReducingTrade
        description: >-
          true or false; leave empty to keep it
      - path: DepositCollateral
        type: input
        value_type: string
        label: DepositCollateral
        description: >-
          true or false; leave empty to keep it
      - path: WithdrawCollateral
        type: input
        value_type: string
        label: WithdrawCollateral
        description: >-
          true or false; leave empty to keep it
    llm_context: |
      Set a capability to false to block it, true to allow it; one left out keeps its current value.
      RiskIncreasingTrade false makes the trader reduce-only; every capability false freezes it.
      The account is the trader's Trader account.
      Leave fetchBeforeUse false: a refetch drops earlier Phoenix changes to this trader. Call
      list_phoenix_trader_positions first; it loads the trader into the surfnet.
    address:
      type: pubkey

  - id: phoenix-stop-loss-trigger
    name: Phoenix Stop-Loss Trigger
    description: >-
      Move the trigger and execution prices of a trader's existing take-profit and stop-loss legs
      on one market.
    idl_account_name: StopLosses
    properties:
      - path: stopLosses.0.triggerPrice.inner
        label: Upper trigger (ticks)
        description: >-
          Price in ticks at or above which the greater-than leg fires: the take-profit of a long or
          the stop loss of a short. Example: 12000
      - path: stopLosses.0.executionPrice.inner
        label: Upper execution limit (ticks)
        description: >-
          Worst price in ticks the greater-than leg's order may fill at once it fires.
          Example: 12000
      - path: stopLosses.1.triggerPrice.inner
        label: Lower trigger (ticks)
        description: >-
          Price in ticks at or below which the less-than leg fires: the stop loss of a long or the
          take-profit of a short. Example: 11500
      - path: stopLosses.1.executionPrice.inner
        label: Lower execution limit (ticks)
        description: >-
          Worst price in ticks the less-than leg's order may fill at once it fires. Example: 11500
    llm_context: |
      This arms or disarms a take-profit or stop-loss leg a trader already placed with
      PlaceStopLoss, for example moving its trigger next to the current mark so a bot's
      ExecuteStopLoss call can be tested without waiting for the market. It does not place a new
      leg, change its size or execute it. Position conditional orders
      (PlacePositionConditionalOrder) are a separate mechanism this template does not touch.
      stopLosses.0 is the greater-than leg (take-profit of a long, stop loss of a short) and
      stopLosses.1 the less-than leg (stop loss of a long, take-profit of a short). Each has a
      flags byte, at account byte 49 for stopLosses.0 and 129 for stopLosses.1: bit 0 active,
      bit 2 buy, otherwise sell. Only an active leg fires, so edit only active legs.
      A sell's execution price is at or below its trigger and a buy's at or above it. The Phoenix
      app's default slippage is 0.25% for a take-profit and 10% for a stop loss.
      Prices are mark ticks: read the market's markTicks from list_phoenix_markets.
      Pass prices as JSON numbers. Do not touch positionSequenceNumber: it must keep matching the
      current position or the stop loss no longer applies.
      The account is the trader's StopLosses PDA for the market: ["stoploss", trader account,
      asset id as u64 little-endian]. To find it, call getProgramAccounts on the Phoenix program
      with dataSize 328 and a memcmp of the trader account at offset 224; assetId is the u32 at 256.
      Set fetchBeforeUse: true so the stop loss is fetched from the upstream datasource first.
    address:
      type: pubkey

  - id: phoenix-permission-limits
    name: Phoenix Delegated Permission Limits
    description: >-
      Expire a delegated Phoenix permission or use up its remaining signer actions.
    idl_account_name: PermissionAccount
    properties:
      - path: expiresAtTimestamp
        label: Expires at (unix seconds)
        description: >-
          Unix time after which the permission stops working; 0 never expires. Example: 1
      - path: numSignerActionsRemaining
        label: Signer actions remaining
        description: >-
          Actions the delegate may still sign; 0 means none are left. Example: 0
    llm_context: |
      A PermissionAccount lets a delegated key sign certain Phoenix actions for an authority. This
      tests code that signs through one when the permission runs out, either by expiry or by using
      up its signer actions. It does not change which actions the permission grants. Trading
      delegation through a Trader's position_authority (DelegateTrader) is separate and not touched.
      expiresAtTimestamp is unix seconds: 0 never expires, any past time expires it now.
      numSignerActionsRemaining at 0 leaves the delegate no actions. Pass both as JSON numbers.
      The account is the PermissionAccount PDA ["permission", authority, delegated key]. To find
      it, call getProgramAccounts on the Phoenix program with dataSize 168 and a memcmp of the
      authority at offset 8 or of the delegated key at offset 40.
      Set fetchBeforeUse: true so the permission is fetched from the upstream datasource first.
    address:
      type: pubkey
